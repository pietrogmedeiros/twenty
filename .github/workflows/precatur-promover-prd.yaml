name: Precatur — promover imagem para PRD

# Não builda nada: aponta a tag "prd" para a imagem que o build do HML gerou
# para o mesmo commit (tag = SHA). Para promover, empurrar o commit já testado
# no HML para a branch precatur-prd:
#   git push origin feat/precatur-chat:precatur-prd
# Depois, clicar Implantar no twenty-prd e no twenty-prd-worker.
on:
  push:
    branches:
      - precatur-prd

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag para prd
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/twenty-precatur
          SHA: ${{ github.sha }}
        run: |
          # O build do HML pode ainda estar rodando para este commit: espera até 40 min
          for attempt in $(seq 1 80); do
            if docker buildx imagetools inspect "$IMAGE:$SHA" >/dev/null 2>&1; then
              docker buildx imagetools create --tag "$IMAGE:prd" "$IMAGE:$SHA"
              echo "Imagem $SHA promovida para prd"
              exit 0
            fi
            sleep 30
          done
          echo "Não existe imagem do HML para o commit $SHA — rode o build do HML antes"
          exit 1

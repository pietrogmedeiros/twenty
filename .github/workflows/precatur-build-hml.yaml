name: Precatur — build imagem HML

on:
  push:
    branches:
      - feat/precatur-gerador-proposta
    paths:
      - '.github/workflows/precatur-build-hml.yaml'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da imagem no GHCR'
        required: false
        default: 'hml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/twenty-precatur:${{ inputs.tag || 'hml' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
